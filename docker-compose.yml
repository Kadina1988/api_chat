services: 
  postgres_db:
    image: postgres 
    environment:
      POSTGRES_USER: owner 
      POSTGRES_PASSWORD: postgres 
    ports: 
      - "5432:5432"
    volumes: 
      - /root/api_chat/tmp/db:/var/lib/postgresql/data  
  
  app:
    build: 
      context: .
      dockerfile: Dockerfile.dev
    command: bundle exec rails s -b 0.0.0.0 
    volumes: 
      - /root/api_chat:/app 
    working_dir: /app 
    ports: 
      - "3000:3000" 
    depends_on: 
      - postgres_db 
    

  